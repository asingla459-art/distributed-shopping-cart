worker_processes auto;
events { worker_connections 4096; }

http {
  log_format json escape=json '{"ts":"$time_iso8601","component":"lb","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","rt":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout json;

  upstream cart_service {
    # Optional user affinity for a higher L1-cache hit ratio (correctness does not
    # depend on it - cache invalidation covers failover):
    # hash $http_authorization consistent;
    # passive health checks: 1 failure -> instance skipped for 3 s
    server app1:8000 max_fails=1 fail_timeout=3s;
    server app2:8000 max_fails=1 fail_timeout=3s;
    server app3:8000 max_fails=1 fail_timeout=3s;
    keepalive 64;
  }

  limit_req_zone $binary_remote_addr zone=perip:10m rate=200r/s;

  server {
    listen 80;
    client_max_body_size 64k;

    location / {
      limit_req zone=perip burst=400 nodelay;
      proxy_pass http://cart_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      # Retry a failed request on the next instance. POST/PUT/DELETE are retried
      # too (non_idempotent) - this is safe ONLY because clients send an
      # Idempotency-Key that the service de-duplicates atomically in Redis.
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 3;
    }
  }
}
