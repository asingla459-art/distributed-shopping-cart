# Durability: append-only file, fsync every second (max ~1 s of writes lost on a host crash)
appendonly yes
appendfsync everysec
save 300 10
# Memory policy: never evict carts/orders silently; expiry is explicit via per-key TTLs
maxmemory 512mb
maxmemory-policy noeviction
# Notify on expired keys (useful for cart-abandonment analytics)
notify-keyspace-events Ex
