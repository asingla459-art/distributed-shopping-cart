# Full stack on one Docker host (local machine or a cloud VM):
#   nginx LB  ->  app1, app2, app3 (stateless)  ->  Redis primary (+ replica)
#                                  order-worker <-  Redis Streams
#
#   cp .env.example .env   # set secrets
#   docker compose up -d --build
#   docker compose exec app1 python -m app.seed
x-app: &app
  build: { context: ., dockerfile: deploy/docker/Dockerfile }
  restart: unless-stopped            # crashed instances are restarted automatically
  env_file: .env
  environment: &appenv
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    CONSISTENCY_MODE: ${CONSISTENCY_MODE:-consistent}
  depends_on:
    redis: { condition: service_healthy }
  networks: [backend]

services:
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2, app3]
    networks: [backend]

  app1: { <<: *app, environment: { <<: *appenv, INSTANCE_ID: app-1 } }
  app2: { <<: *app, environment: { <<: *appenv, INSTANCE_ID: app-2 } }
  app3: { <<: *app, environment: { <<: *appenv, INSTANCE_ID: app-3 } }

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment: { <<: *appenv, WORKER_ID: worker-1 }
    healthcheck: { disable: true }

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}",
              "--masterauth", "${REDIS_PASSWORD}"]
    volumes: ["./deploy/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro", "redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [backend]

  redis-replica:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--replicaof", "redis", "6379", "--masterauth", "${REDIS_PASSWORD}",
              "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redis-replica-data:/data"]
    depends_on: [redis]
    networks: [backend]

volumes:
  redis-data:
  redis-replica-data:

networks:
  backend:
